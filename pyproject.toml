[project]
name = "vifa-m3-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "numpy==2.4.6",
  "pandas==2.3.3",
  "pydantic==2.13.4",
  "scipy==1.18.1",
  "statsforecast==2.1.1",
  "uvicorn==0.52.3",
]

[tool.fastapi]
entrypoint = "m3_worker.main:app"

[tool.unittest]
start-directory = "tests"
