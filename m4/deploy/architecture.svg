<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 576" role="img" aria-labelledby="m4-deploy-title m4-deploy-desc">
  <title id="m4-deploy-title">M4：Node-RED 页面与 Docker 后端部署</title>
  <desc id="m4-deploy-desc">NocoBase 中的 iframe 通过带访问 Token 的 HTTPS URL 访问 Node-RED 页面；Node-RED 校验凭据后将 API 请求转发给 Docker 后端。后端单副本运行，独立保存参数和历史，并使用服务端凭据只读访问现有 NocoBase 数据。</desc>
  <defs><marker id="m4-deploy-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs>
  <style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172033}.title{font-size:20px;font-weight:650}.label{font-size:16px}.note{font-size:14px;fill:#64748b}.zone{fill:#f8fafc;stroke:#cbd5e1;stroke-dasharray:5 5}.box{fill:white;stroke:#cbd5e1}.link{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#m4-deploy-arrow)}</style>
  <rect width="1120" height="576" fill="#f3f6fb"/>
  <rect class="zone" x="24" y="40" width="280" height="200" rx="12"/>
  <rect class="zone" x="24" y="300" width="280" height="200" rx="12"/>
  <rect class="zone" x="344" y="40" width="752" height="460" rx="12"/>
  <text class="note" x="40" y="68">客户浏览器</text><text class="note" x="40" y="328">现有数据服务</text><text class="note" x="364" y="68">部署服务器 · 复用现有 Node-RED HTTPS 入口</text>
  <path class="link" d="M280 156H376"/><path class="link" d="M688 156H768"/><path class="link" d="M532 224V356"/><path class="link" d="M688 416H768"/><path class="link" d="M376 416H280"/>
  <rect x="288" y="116" width="80" height="28" fill="#f3f6fb"/><text class="note" x="292" y="136">HTTPS</text>
  <rect x="696" y="116" width="64" height="28" fill="#f8fafc"/><text class="note" x="700" y="136">/m4</text>
  <rect x="544" y="276" width="128" height="28" fill="#f8fafc"/><text class="note" x="552" y="296">/m4-api/…</text>
  <rect x="696" y="376" width="64" height="28" fill="#f8fafc"/><text class="note" x="700" y="396">/data</text>
  <rect x="288" y="376" width="80" height="28" fill="#f3f6fb"/><text class="note" x="296" y="396">只读 GET</text>
  <rect class="box" x="48" y="100" width="232" height="124" rx="12"/><text class="title" x="68" y="136">NocoBase 页面</text><text class="label" x="68" y="168">iframe：/m4?token=…</text><text class="note" x="68" y="200">页面使用专用访问 Token</text>
  <rect x="376" y="100" width="312" height="124" rx="12" fill="#edf3ff" stroke="#376ddb"/><text class="title" x="396" y="136">Node-RED</text><text class="label" x="396" y="168">Token 校验 · 同源 API 转发</text><text class="note" x="396" y="200">页面与 API 都检查访问凭据</text>
  <rect class="box" x="768" y="100" width="300" height="124" rx="12"/><text class="title" x="788" y="136">HTML 页面节点</text><text class="label" x="788" y="168">Template → HTTP Response</text><text class="note" x="788" y="200">运行总览 / 调度 / 设备 / 记录</text>
  <rect class="box" x="48" y="356" width="232" height="120" rx="12"/><text class="title" x="68" y="392">NocoBase API</text><text class="label" x="68" y="424">预测、实时、电价与规则</text><text class="note" x="68" y="456">M3 现有滚动预测结果</text>
  <rect x="376" y="356" width="312" height="120" rx="12" fill="#edf3ff" stroke="#376ddb"/><text class="title" x="396" y="392">M4 Docker 后端</text><text class="label" x="396" y="424">FastAPI · Pyomo / HiGHS</text><text class="note" x="396" y="456">AMD64 · 单 worker · 内部 8844</text>
  <rect class="box" x="768" y="356" width="300" height="120" rx="12"/><text class="title" x="788" y="392">持久化数据卷</text><text class="label" x="788" y="424">SQLite 参数与偏好</text><text class="note" x="788" y="456">完整历史目录，含 .web-jobs</text>
  <text class="note" x="40" y="548">箭头表示访问方向；部署包不包含真实凭据和现场历史。M4 当前生成预览计划，未接设备下发。</text>
</svg>
