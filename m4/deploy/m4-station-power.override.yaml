# Apply LAST alongside the existing base, PV and M3 MAPE compose files.
services:
  m4-api:
    image: ${M4_IMAGE:?Set M4_IMAGE to the release image}
    platform: linux/amd64
    networks:
      default: {}
      nodered_shared:
        aliases: [m4-api]
networks:
  nodered_shared:
    external: true
    name: 1panel-network
