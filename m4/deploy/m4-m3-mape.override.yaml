# Apply LAST, alongside the existing M4 and PV compose files.
services:
  m4-api:
    image: ccr.ccs.tencentyun.com/taidai-holobase-168/omnipower_vifa@sha256:f3d23f4ad0bea17d1e97d1cecd202c77764328863d64bc00c1d9d080dde402b9
    environment:
      M4_M3_SOCKET_PATH: /run/vifa-m3/worker.sock
      M4_M3_ADMIN_TOKEN_FILE: /run/secrets/m3_admin_token
    volumes:
      - type: bind
        source: /userdata/holo/pyfiles/vifa-m3/run
        target: /run/vifa-m3
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /userdata/holo/pyfiles/m4/secrets/m3-admin.token
        target: /run/secrets/m3_admin_token
        read_only: true
        bind:
          create_host_path: false
