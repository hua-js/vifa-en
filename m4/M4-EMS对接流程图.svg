<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1280" viewBox="0 0 2000 1280" role="img" aria-labelledby="title desc">
  <title id="title">M4 与 EMS 对接流程图</title>
  <desc id="desc">M4 生成并人工确认统一的九十六点策略，通过策略下发接口交给 EMS。EMS 内部完成最终校验、规则匹配、统一仲裁和设备执行，再通过执行回读接口将状态与日志返回 M4。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-blue" markerWidth="44" markerHeight="44" refX="40" refY="22" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L44,22 L0,44 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="44" markerHeight="44" refX="40" refY="22" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L44,22 L0,44 Z" fill="#059669"/>
    </marker>
    <marker id="arrow-slate" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L13,6.5 L0,13 Z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 52px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 26px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; }
      .lane-title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .lane-subtitle { font: 400 22px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .node-title { font: 700 27px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; text-anchor: middle; }
      .node-text { font: 400 21px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #475569; text-anchor: middle; }
      .node-title-inverse { font: 700 27px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #ffffff; text-anchor: middle; }
      .node-text-inverse { font: 400 21px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #dbeafe; text-anchor: middle; }
      .step { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }
      .api-title { font: 700 31px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #ffffff; text-anchor: middle; }
      .api-text { font: 400 21px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #dbeafe; text-anchor: middle; }
      .api-text-green { font: 400 21px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #d1fae5; text-anchor: middle; }
      .boundary-title { font: 700 31px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #991b1b; text-anchor: middle; }
      .boundary-text { font: 500 24px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #7f1d1d; text-anchor: middle; }
    </style>
  </defs>

  <rect width="2000" height="1280" fill="#f8fafc"/>

  <text x="1000" y="76" class="title" text-anchor="middle">M4 与 EMS 对接流程</text>
  <text x="1000" y="118" class="subtitle" text-anchor="middle">M4 负责“生成与确认策略”，EMS 负责“校验与执行策略”</text>

  <!-- M4 swimlane -->
  <rect x="55" y="155" width="1890" height="350" rx="28" fill="#eff6ff" stroke="#93c5fd" stroke-width="3"/>
  <rect x="55" y="155" width="260" height="350" rx="28" fill="#dbeafe"/>
  <path d="M287 155 H315 V505 H287 Z" fill="#dbeafe"/>
  <text x="185" y="280" class="lane-title" fill="#1d4ed8" text-anchor="middle">M4</text>
  <text x="185" y="322" class="lane-subtitle" fill="#1e40af" text-anchor="middle">优化调度控制台</text>
  <text x="185" y="365" class="lane-subtitle" fill="#1e40af" text-anchor="middle">决策责任</text>

  <!-- M4 nodes -->
  <g filter="url(#shadow)">
    <rect x="355" y="245" width="260" height="170" rx="20" fill="#ffffff" stroke="#bfdbfe" stroke-width="3"/>
    <circle cx="390" cy="278" r="22" fill="#2563eb"/>
    <text x="390" y="279" class="step">1</text>
    <text x="485" y="315" class="node-title">汇总输入</text>
    <text x="485" y="354" class="node-text">预测 / 电价 / SOC</text>
    <text x="485" y="385" class="node-text">设备状态与安全边界</text>

    <rect x="665" y="245" width="260" height="170" rx="20" fill="#ffffff" stroke="#bfdbfe" stroke-width="3"/>
    <circle cx="700" cy="278" r="22" fill="#2563eb"/>
    <text x="700" y="279" class="step">2</text>
    <text x="795" y="315" class="node-title">AI 生成策略</text>
    <text x="795" y="354" class="node-text">光伏消纳 + 电价优化</text>
    <text x="795" y="385" class="node-text">需量控制统一决策</text>

    <rect x="975" y="245" width="260" height="170" rx="20" fill="#ffffff" stroke="#bfdbfe" stroke-width="3"/>
    <circle cx="1010" cy="278" r="22" fill="#2563eb"/>
    <text x="1010" y="279" class="step">3</text>
    <text x="1105" y="315" class="node-title">人工调整</text>
    <text x="1105" y="354" class="node-text">查看理由与风险</text>
    <text x="1105" y="385" class="node-text">必要时修改策略</text>

    <rect x="1285" y="245" width="260" height="170" rx="20" fill="#ffffff" stroke="#bfdbfe" stroke-width="3"/>
    <circle cx="1320" cy="278" r="22" fill="#2563eb"/>
    <text x="1320" y="279" class="step">4</text>
    <text x="1415" y="315" class="node-title">安全预检</text>
    <text x="1415" y="354" class="node-text">校验 96 个时间点</text>
    <text x="1415" y="385" class="node-text">通过后允许发送</text>

    <rect x="1595" y="245" width="300" height="170" rx="20" fill="#2563eb" stroke="#1d4ed8" stroke-width="3"/>
    <circle cx="1630" cy="278" r="22" fill="#ffffff"/>
    <text x="1630" y="279" style="font:700 22px sans-serif;fill:#2563eb;text-anchor:middle;dominant-baseline:middle">5</text>
    <text x="1745" y="315" class="node-title-inverse">人工确认发送</text>
    <text x="1745" y="354" class="node-text-inverse">统一的 24h / 96 点计划</text>
    <text x="1745" y="385" class="node-text-inverse">不是三个模板调用</text>
  </g>

  <line x1="615" y1="330" x2="645" y2="330" stroke="#475569" stroke-width="5" marker-end="url(#arrow-slate)"/>
  <line x1="925" y1="330" x2="955" y2="330" stroke="#475569" stroke-width="5" marker-end="url(#arrow-slate)"/>
  <line x1="1235" y1="330" x2="1265" y2="330" stroke="#475569" stroke-width="5" marker-end="url(#arrow-slate)"/>
  <line x1="1545" y1="330" x2="1575" y2="330" stroke="#475569" stroke-width="5" marker-end="url(#arrow-slate)"/>

  <!-- Interface band -->
  <rect x="55" y="535" width="1890" height="210" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="185" y="618" class="lane-title" fill="#334155" text-anchor="middle">接口边界</text>
  <text x="185" y="657" class="lane-subtitle" fill="#64748b" text-anchor="middle">双方共同确认</text>

  <g filter="url(#shadow)">
    <rect x="355" y="570" width="710" height="140" rx="22" fill="#059669"/>
    <text x="710" y="622" class="api-title">执行状态与日志回读</text>
    <text x="710" y="662" class="api-text-green">接收 / 拒绝 / 执行中 / 完成 / 部分失败</text>
    <text x="710" y="694" class="api-text-green">EMS → M4，只读回传</text>

    <rect x="1185" y="570" width="710" height="140" rx="22" fill="#2563eb"/>
    <text x="1540" y="622" class="api-title">统一策略下发</text>
    <text x="1540" y="662" class="api-text">策略编号 / 版本 / 设备 / 时间点 / 功率</text>
    <text x="1540" y="694" class="api-text">M4 → EMS，由人工触发</text>
  </g>

  <!-- EMS swimlane -->
  <rect x="55" y="775" width="1890" height="300" rx="28" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="3"/>
  <rect x="55" y="775" width="260" height="300" rx="28" fill="#d1fae5"/>
  <path d="M287 775 H315 V1075 H287 Z" fill="#d1fae5"/>
  <text x="185" y="890" class="lane-title" fill="#047857" text-anchor="middle">EMS</text>
  <text x="185" y="932" class="lane-subtitle" fill="#065f46" text-anchor="middle">既有能源管理系统</text>
  <text x="185" y="974" class="lane-subtitle" fill="#065f46" text-anchor="middle">执行责任</text>

  <g filter="url(#shadow)">
    <rect x="355" y="840" width="300" height="170" rx="20" fill="#ffffff" stroke="#a7f3d0" stroke-width="3"/>
    <circle cx="392" cy="873" r="22" fill="#059669"/>
    <text x="392" y="874" class="step">9</text>
    <text x="505" y="910" class="node-title">记录执行结果</text>
    <text x="505" y="949" class="node-text">状态、实际功率</text>
    <text x="505" y="980" class="node-text">失败原因与日志</text>

    <rect x="725" y="840" width="300" height="170" rx="20" fill="#ffffff" stroke="#a7f3d0" stroke-width="3"/>
    <circle cx="762" cy="873" r="22" fill="#059669"/>
    <text x="762" y="874" class="step">8</text>
    <text x="875" y="910" class="node-title">执行设备控制</text>
    <text x="875" y="949" class="node-text">EMS 控制 PCS / BMS</text>
    <text x="875" y="980" class="node-text">暂停、停止也在 EMS</text>

    <rect x="1095" y="840" width="360" height="170" rx="20" fill="#ffffff" stroke="#a7f3d0" stroke-width="3"/>
    <circle cx="1132" cy="873" r="22" fill="#059669"/>
    <text x="1132" y="874" class="step">7</text>
    <text x="1275" y="910" class="node-title">规则匹配与统一仲裁</text>
    <text x="1275" y="949" class="node-text">光储充 / 峰谷套利 / 需量控制</text>
    <text x="1275" y="980" class="node-text">属于 EMS 内部实现</text>

    <rect x="1525" y="840" width="370" height="170" rx="20" fill="#ffffff" stroke="#a7f3d0" stroke-width="3"/>
    <circle cx="1562" cy="873" r="22" fill="#059669"/>
    <text x="1562" y="874" class="step">6</text>
    <text x="1710" y="910" class="node-title">接收并最终校验</text>
    <text x="1710" y="949" class="node-text">格式、幂等、设备状态</text>
    <text x="1710" y="980" class="node-text">接受或返回拒绝原因</text>
  </g>

  <line x1="1525" y1="925" x2="1475" y2="925" stroke="#475569" stroke-width="5" marker-end="url(#arrow-slate)"/>
  <line x1="1095" y1="925" x2="1045" y2="925" stroke="#475569" stroke-width="5" marker-end="url(#arrow-slate)"/>
  <line x1="725" y1="925" x2="675" y2="925" stroke="#475569" stroke-width="5" marker-end="url(#arrow-slate)"/>

  <!-- Strong cross-lane arrows -->
  <path d="M1745 415 V565" fill="none" stroke="#2563eb" stroke-width="12" marker-end="url(#arrow-blue)"/>
  <path d="M1745 710 V835" fill="none" stroke="#2563eb" stroke-width="12" marker-end="url(#arrow-blue)"/>
  <path d="M505 840 V715" fill="none" stroke="#059669" stroke-width="12" marker-end="url(#arrow-green)"/>
  <path d="M505 570 V492" fill="none" stroke="#059669" stroke-width="12" marker-end="url(#arrow-green)"/>

  <!-- M4 readback destination -->
  <rect x="355" y="435" width="300" height="52" rx="14" fill="#dcfce7" stroke="#86efac" stroke-width="2"/>
  <text x="505" y="469" style="font:700 22px -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;fill:#166534;text-anchor:middle">M4 回显执行记录</text>

  <!-- Boundary statement -->
  <rect x="180" y="1110" width="1640" height="125" rx="24" fill="#fef2f2" stroke="#fca5a5" stroke-width="3"/>
  <text x="1000" y="1160" class="boundary-title">核心边界</text>
  <text x="1000" y="1203" class="boundary-text">M4 对接的是“统一策略接口”，不是 EMS 内部的三个规则模板；M4 永不直接控制 PCS / BMS。</text>
</svg>
