<svg xmlns="http://www.w3.org/2000/svg" width="1408" height="832" viewBox="0 0 1408 832" role="img" aria-labelledby="m4-solver-title m4-solver-desc">
<title id="m4-solver-title">M4 求解器决策与 EMS 边界</title>
<desc id="m4-solver-desc">输入经 Pyomo 建模和 HiGHS 求解生成三候选，独立复验后按经营偏好数学选择，再通过实时门禁形成一套计划预览；异常阻断。EMS 接口为未来边界，当前未下发。</desc>
<defs>
<marker id="m4-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#1e293b}.heading{font-size:32px;font-weight:650}.label{font-size:24px;font-weight:600}.body{font-size:16px;fill:#475569}.edge{font-size:16px;fill:#64748b}.node{fill:#fff;stroke:#cbd5e1;stroke-width:1.2}.primary{fill:#eff6ff;stroke:#3b82f6;stroke-width:1.5}.line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#m4-arrow)}
</style></defs>
<rect width="1408" height="832" fill="#f8fafc"/>
<text x="40" y="56" class="heading">M4：数学模型负责计划，求解器负责决策</text>
<text x="40" y="92" class="body">Pyomo + HiGHS · 2026-09-08 · 当前只生成预览，AI 退出决策链</text>
<!-- Connectors precede nodes. -->
<path class="line" d="M280 280H352"/><path class="line" d="M632 280H704"/>
<path class="line" d="M964 280H1036"/><path class="line" d="M1184 204V220"/>
<path class="line" d="M1184 340V432"/>
<path class="line" d="M1036 492H964"/>
<path class="line" d="M1184 552V632"/>
<path class="line" d="M704 492H632" stroke-dasharray="6 6"/>
<text x="288" y="260" class="edge">96点</text><text x="640" y="260" class="edge">候选</text>
<text x="972" y="260" class="edge">合法集</text>
<text x="1200" y="392" class="edge">最终方案</text><text x="976" y="476" class="edge">通过</text>
<text x="1200" y="600" class="edge">变化 / 过期</text><text x="644" y="472" class="edge">未来</text>
<!-- Native model and solver are grouped in one component. -->
<rect class="node" x="40" y="220" width="240" height="120" rx="8"/>
<text x="64" y="256" class="label">输入校验</text><text x="64" y="288" class="body">预测 / 电价 / 参与柜</text><text x="64" y="316" class="body">版本 / SOC / 安全边界</text>
<rect class="primary" x="352" y="220" width="280" height="120" rx="8"/>
<text x="376" y="256" class="label">Pyomo 调度模型</text><text x="376" y="288" class="body">HiGHS 分层 MILP</text><text x="376" y="316" class="body">balanced / cost / pv</text>
<rect class="node" x="704" y="220" width="260" height="120" rx="8"/>
<text x="728" y="256" class="label">独立复验</text><text x="728" y="288" class="body">96 点物理约束</text><text x="728" y="316" class="body">重新计算经营指标</text>
<rect class="primary" x="1036" y="220" width="300" height="120" rx="8"/>
<text x="1060" y="256" class="label">Pyomo 最终决策</text><text x="1060" y="288" class="body">HiGHS 单选 MILP</text><text x="1060" y="316" class="body">需量 → 偏好 → 并列顺序</text>
<rect class="node" x="1036" y="124" width="300" height="80" rx="8"/>
<text x="1060" y="156" class="label">已保存经营偏好</text><text x="1060" y="184" class="body">沿用版本及精确比较容差</text>
<rect class="node" x="1036" y="432" width="300" height="120" rx="8"/>
<text x="1060" y="468" class="label">实时门禁</text><text x="1060" y="500" class="body">状态 / 版本 / 参与柜</text><text x="1060" y="528" class="body">原有效期不可延长</text>
<rect class="node" x="704" y="432" width="260" height="120" rx="8"/>
<text x="728" y="468" class="label">一套计划预览</text><text x="728" y="500" class="body">可展开三候选对比</text><text x="728" y="528" class="body">决策与输入证据存档</text>
<rect class="node" x="1036" y="632" width="300" height="88" rx="8"/>
<text x="1060" y="668" class="label">阻断本轮结果</text><text x="1060" y="696" class="body">重新取数计算，不使用旧计划</text>
<rect class="node" x="352" y="432" width="280" height="120" rx="8" stroke-dasharray="6 6"/>
<text x="376" y="468" class="label">EMS 接口 · 未接入</text><text x="376" y="500" class="body">未来统一下发 / 执行回读</text><text x="376" y="528" class="body">EMS 是唯一设备执行者</text>
<text x="40" y="616" class="body">安全约束不变：SOC、功率、互斥、末端 SOC、逆流与逐柜隔离。</text>
<text x="40" y="648" class="body">最终方案表示本轮合法候选内的偏好最优；可行与已证明最优分别报告。</text>
<path d="M40 760H1336" stroke="#cbd5e1"/>
<path d="M40 792H80" stroke="#64748b" stroke-width="2"/><text x="92" y="800" class="body">实线：已实现主链</text>
<path d="M320 792H360" stroke="#64748b" stroke-width="2" stroke-dasharray="6 6"/><text x="372" y="800" class="body">虚线：未来接口</text>
<text x="704" y="800" class="body">图中合并每套候选的分层求解细节；当前 EMS 未下发</text>
</svg>